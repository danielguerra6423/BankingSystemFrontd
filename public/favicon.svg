<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>MiPlata</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22cc60" />
      <stop offset="1" stop-color="#1aab50" />
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b84b" />
      <stop offset="1" stop-color="#c9962a" />
    </linearGradient>
  </defs>
  <!-- tarjeta -->
  <rect x="3" y="11" width="58" height="42" rx="8" fill="url(#card)" />
  <!-- chip -->
  <rect x="11" y="20" width="14" height="11" rx="2.5" fill="url(#chip)" />
  <!-- número de la tarjeta -->
  <rect x="11" y="40" width="26" height="4" rx="2" fill="#07130d" opacity="0.55" />
  <rect x="41" y="40" width="12" height="4" rx="2" fill="#07130d" opacity="0.55" />
</svg>
